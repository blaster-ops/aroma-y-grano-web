<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Logotipo de Aroma &amp; Grano - Tostaduría Artesanal">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C88A35"/>
      <stop offset="100%" stop-color="#8C531B"/>
    </linearGradient>
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2314"/>
      <stop offset="100%" stop-color="#1F110A"/>
    </linearGradient>
  </defs>
  
  <!-- Icono de Grano de Café y Llama Artesanal -->
  <g transform="translate(15, 10)">
    <!-- Círculo exterior decorativo -->
    <circle cx="30" cy="30" r="28" fill="none" stroke="url(#coffeeGrad)" stroke-width="2.5" stroke-dasharray="4,2"/>
    <!-- Silueta del Grano de Café -->
    <ellipse cx="30" cy="30" rx="20" ry="24" fill="url(#beanGrad)"/>
    <!-- Hendidura curva del grano -->
    <path d="M 30,10 C 24,20 36,40 30,50" fill="none" stroke="#C88A35" stroke-width="3" stroke-linecap="round"/>
    <!-- Pequeño destello / hoja orgánica -->
    <path d="M 40,16 C 45,12 47,8 48,6 C 47,11 44,15 40,16 Z" fill="#C88A35"/>
  </g>
  
  <!-- Tipografía del Logotipo -->
  <g transform="translate(85, 20)">
    <!-- Título principal -->
    <text x="0" y="26" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#2B1810" letter-spacing="0.5">
      AROMA <tspan fill="#C88A35">&amp;</tspan> GRANO
    </text>
    <!-- Subtítulo -->
    <text x="2" y="44" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#7D6556" letter-spacing="3.2">
      TOSTADURÍA ARTESANAL
    </text>
  </g>
</svg>
